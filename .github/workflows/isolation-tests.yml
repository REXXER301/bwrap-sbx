# Runs the sbx isolation suite (tests/run.sh) in rootless podman.
name: isolation tests

on:
  push:
    branches: [main]
    paths: [sbx, "tests/**", .github/workflows/isolation-tests.yml]
  pull_request:
    paths: [sbx, "tests/**", .github/workflows/isolation-tests.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 lets only AppArmor-profiled programs create user
      # namespaces; bwrap inside the test container needs them.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Tool versions
        run: |
          podman --version
          uname -r

      - name: Run isolation suite
        run: tests/run.sh
